# Runs every test on a real Windows machine on each push, including the Windows-only ones
# (DPAPI, registry, PowerShell shortcuts, install.ps1 under Windows PowerShell 5.1), then a
# real KeePassXC install.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyflakes
      - name: Lint
        run: python -m pyflakes .
      - name: Tests
        shell: bash
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
          exit ${PIPESTATUS[0]}
      # The real thing: download KeePassXC, check its checksum and signature, install it
      # silently, apply the recommended settings, create a vault and open it. Also checks
      # the python.org installer install.ps1 would use is signed. Throwaway machine only.
      - name: Real KeePassXC install
        shell: bash
        env:
          VAULTKIT_REAL_KEEPASSXC: "1"
        run: |
          python -m unittest tests.test_windows.RealKeePassXC -v 2>&1 | tee -a test-output.txt
          exit ${PIPESTATUS[0]}
      # Each failing test becomes an annotation (title + traceback tail), readable through
      # the GitHub API without downloading the raw log.
      - name: Report failures
        if: failure()
        shell: python
        run: |
          import re
          text = open("test-output.txt", encoding="utf-8", errors="replace").read()
          for block in re.split(r"\n={50,}\n", text)[1:]:
              head, _, body = block.partition("\n" + "-" * 70 + "\n")
              body = body.split("\n" + "-" * 70 + "\nRan ")[0].strip()[-2500:]
              msg = body.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              title = head.strip()[:180]
              for a, b in (("%", "%25"), ("\r", "%0D"), ("\n", "%0A"), (":", "%3A"), (",", "%2C")):
                  title = title.replace(a, b)
              print(f"::error title={title}::{msg}")
          summary = [l for l in text.splitlines() if re.match(r"(Ran \d+ tests?|OK|FAILED)\b", l)]
          print(f"::notice title=summary::{' / '.join(summary[-2:]) or 'tests did not finish'}")
