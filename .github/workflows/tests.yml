# Runs every test on a real Windows machine on each push, including the Windows-only ones
# (DPAPI, registry, PowerShell shortcuts, install.ps1 under Windows PowerShell 5.1).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyflakes
      - name: Lint
        run: python -m pyflakes .
      - name: Tests
        run: python -m unittest discover -s tests -v
